services:

  postgres:
    image: postgres:16

    container_name: skyops-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: skyops
      POSTGRES_USER: skyops_user
      POSTGRES_PASSWORD: SkyOps@123

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyops_user -d skyops"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .

    container_name: skyops-backend

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/skyops
      SPRING_DATASOURCE_USERNAME: skyops_user
      SPRING_DATASOURCE_PASSWORD: SkyOps@123

    ports:
      - "8080:8080"

    restart: unless-stopped

volumes:
  postgres-data: